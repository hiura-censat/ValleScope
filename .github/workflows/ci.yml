name: CI and GHCR Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  # 1) Python package + CLI test
  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ValleScope
        run: |
          pip install -e .
          pip install pytest
      - name: Run CLI tests
        run: |
          vallescope --help
          vallescope doctor || true
          vallescope run --fasta "examples/demo_inputs/*.fa.gz" --bed "examples/demo_inputs/*.bed" -n -j 2 || true

  lint-ruff:
    name: Ruff (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Run ruff
        run: ruff check .

  type-mypy:
    name: mypy (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - name: Install deps
        run: |
          pip install -e .
          pip install mypy==1.11.2 types-requests types-PyYAML
      - name: Run mypy
        run: mypy src

  # 2) Docker build & smoke test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker compose build
      - name: Dry-run test
        run: docker compose run --rm runner --help

  # 3) Publish to GHCR (only on tag)
  publish:
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/hiura-censat/vallescope:latest
            ghcr.io/hiura-censat/vallescope:${{ github.ref_name }}

