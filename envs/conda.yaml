name: vallescope
channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # Python
  - python=3.11

  # Snakemake
  - snakemake=7.32.4

  # command line tools
  - minimap2=2.28
  - samtools=1.20
  - blast=2.14.1
  - meryl=1.4
  - bedtools=2.31.1
  - hmmer=3.4
  - bedops=2.4.42
  - genmap=1.3.0

  # Python library
  - numpy=1.26.4
  - pandas=2.2.1
  - matplotlib=3.8.3
  - seaborn=0.13.2
  - pybigwig=0.3.22
  - seqtk=1.4
  - pysam=0.22.1
  - python-edlib=1.3.9
  - vsearch=2.29.1
  - syri=1.7.1
  - bcftools=1.21
  - tabix=1.11
  - truvari=5.4.0

  # others
  - perl
  - unzip
  - coreutils
  - pip
  - ucsc-bedgraphtobigwig
  - conda-lock

